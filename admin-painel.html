<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrativo - Agendamento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #logoutBtn {
      background: white;
      color: #111;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
    }

    #status {
      color: #555;
    }
  </style>
</head>

<body>

  <header>
    <h1>Área administrativa</h1>
    <button id="logoutBtn">Sair</button>
  </header>

  <main>

    <div class="card">
      <h2>Bem-vindo!</h2>
      <p id="status">Verificando acesso...</p>
    </div>

    <div class="card">
      <h2>Reservas</h2>
      <p>Em breve veremos aqui todas as reservas realizadas.</p>
    </div>

    <div class="card">
      <h2>Aulas</h2>
      <p>Em breve poderemos criar e editar os horários das aulas.</p>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://ezxrcpnkdvnhugpdcjup.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_8hZQrzNuLgy6jyZWgYY7cA_q0Njvqjg";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    async function verificarAcesso() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        window.location.href = "admin.html";
        return;
      }

      document.getElementById("status").textContent =
        "Login realizado com sucesso: " + data.user.email;
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "admin.html";
    });

    verificarAcesso();
  </script>

</body>
</html>
