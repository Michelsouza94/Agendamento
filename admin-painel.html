<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Painel Administrativo - Agendamento</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    #logoutBtn {
      background: white;
      color: #111;
      border: 0;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h2 {
      margin-top: 0;
    }

    #status {
      color: #555;
    }

    .tabela-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th,
    td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      white-space: nowrap;
    }

    th {
      background: #f5f5f5;
    }

    .sem-reservas {
      color: #666;
      margin-top: 15px;
    }

    input {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      width: 100%;
      max-width: 400px;
    }

    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #formNovaAula button {
      background: #111;
      color: white;
    }

    #formNovaAula button:hover {
      opacity: 0.9;
    }

    #aulasTabela button {
      background: #111;
      color: white;
    }

    #aulasTabela button:hover {
      opacity: 0.9;
    }

  </style>

</head>


<body>

  <header>

    <h1>Área administrativa</h1>

    <button id="logoutBtn">
      Sair
    </button>

  </header>


  <main>

    <!-- STATUS DO LOGIN -->

    <div class="card">

      <h2>Bem-vindo!</h2>

      <p id="status">
        Verificando acesso...
      </p>

    </div>


    <!-- RESERVAS -->

    <div class="card">

      <h2>Reservas</h2>

      <div class="tabela-container">

        <table>

          <thead>

            <tr>

              <th>Cliente</th>

              <th>WhatsApp</th>

              <th>Data</th>

              <th>Horário</th>

              <th>Turma</th>

            </tr>

          </thead>


          <tbody id="reservasTabela">
          </tbody>

        </table>

      </div>


      <p
        id="semReservas"
        class="sem-reservas"
        style="display: none;"
      >
        Nenhuma reserva encontrada.
      </p>

    </div>


    <!-- AULAS -->

    <div class="card">

      <!-- NOVA AULA -->

      <div style="margin-bottom: 25px;">

        <h3>Nova aula</h3>


        <form id="formNovaAula">


          <div style="margin-bottom: 10px;">

            <label for="novaData">
              Data:
            </label>

            <br>

            <input
              type="date"
              id="novaData"
              required
            >

          </div>


          <div style="margin-bottom: 10px;">

            <label for="novoInicio">
              Horário de início:
            </label>

            <br>

            <input
              type="time"
              id="novoInicio"
              required
            >

          </div>


          <div style="margin-bottom: 10px;">

            <label for="novoFim">
              Horário de fim:
            </label>

            <br>

            <input
              type="time"
              id="novoFim"
              required
            >

          </div>


          <div style="margin-bottom: 10px;">

            <label for="novaTurma">
              Turma:
            </label>

            <br>

            <input
              type="text"
              id="novaTurma"
              placeholder="Ex.: Turma 05"
              required
            >

          </div>


          <div style="margin-bottom: 10px;">

            <label for="novaCapacidade">
              Capacidade:
            </label>

            <br>

            <input
              type="number"
              id="novaCapacidade"
              min="1"
              value="8"
              required
            >

          </div>


          <button type="submit">
            Cadastrar aula
          </button>


        </form>


        <p id="mensagemNovaAula"></p>

      </div>


      <!-- LISTA DE AULAS -->

      <h2>
        Aulas
      </h2>


      <div class="tabela-container">

        <table>

          <thead>

            <tr>

              <th>Data</th>

              <th>Horário</th>

              <th>Turma</th>

              <th>Capacidade</th>

              <th>Status</th>

              <th>Ações</th>

            </tr>

          </thead>


          <tbody id="aulasTabela">
          </tbody>

        </table>

      </div>


      <p
        id="semAulas"
        class="sem-reservas"
        style="display: none;"
      >
        Nenhuma aula encontrada.
      </p>


    </div>


  </main>


  <!-- SUPABASE -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ==========================================
    // CONFIGURAÇÃO SUPABASE
    // ==========================================

    const SUPABASE_URL =
      "https://ezxrcpnkdvnhugpdcjup.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_8hZQrzNuLgy6jyZWgYY7cA_q0Njvqjg";


    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ==========================================
    // VERIFICAR ACESSO
    // ==========================================

    async function verificarAcesso() {

      const { data, error } =
        await supabaseClient.auth.getUser();


      if (error || !data.user) {

        window.location.href = "admin.html";

        return;
      }


      document.getElementById("status").textContent =
        "Login realizado com sucesso: " +
        data.user.email;


      await carregarReservas();

      await carregarAulas();

    }


    // ==========================================
    // CARREGAR RESERVAS
    // ==========================================

    async function carregarReservas() {

      const {
        data: reservas,
        error: reservasError
      } =
        await supabaseClient
          .from("reservas")
          .select(
            "id, aula_id, nome, whatsapp, created_at"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (reservasError) {

        console.error(
          "Erro ao carregar reservas:",
          reservasError
        );


        document.getElementById(
          "semReservas"
        ).textContent =
          "Não foi possível carregar as reservas.";


        document.getElementById(
          "semReservas"
        ).style.display = "block";


        return;
      }


      const tabela =
        document.getElementById(
          "reservasTabela"
        );


      const semReservas =
        document.getElementById(
          "semReservas"
        );


      tabela.innerHTML = "";


      if (
        !reservas ||
        reservas.length === 0
      ) {

        semReservas.style.display =
          "block";

        return;
      }


      // IDs das aulas relacionadas às reservas

      const aulaIds = [
        ...new Set(
          reservas.map(
            reserva => reserva.aula_id
          )
        )
      ];


      const {
        data: aulas,
        error: aulasError
      } =
        await supabaseClient
          .from("aulas")
          .select(
            "id, data, horario_inicio, horario_fim, turma"
          )
          .in(
            "id",
            aulaIds
          );


      if (aulasError) {

        console.error(
          "Erro ao carregar aulas das reservas:",
          aulasError
        );


        semReservas.textContent =
          "As reservas foram encontradas, mas não foi possível carregar os horários.";


        semReservas.style.display =
          "block";


        return;
      }


      const aulasPorId = {};


      aulas.forEach(aula => {

        aulasPorId[aula.id] =
          aula;

      });


      reservas.forEach(reserva => {

        const aula =
          aulasPorId[
            reserva.aula_id
          ];


        const linha =
          document.createElement("tr");


        const dataFormatada =
          aula
            ? aula.data
                .split("-")
                .reverse()
                .join("/")
            : "-";


        const horario =
          aula
            ? `${aula.horario_inicio.slice(0, 5)} — ${aula.horario_fim.slice(0, 5)}`
            : "-";


        const turma =
          aula
            ? aula.turma
            : "-";


        linha.innerHTML = `

          <td>
            ${reserva.nome}
          </td>

          <td>
            ${reserva.whatsapp}
          </td>

          <td>
            ${dataFormatada}
          </td>

          <td>
            ${horario}
          </td>

          <td>
            ${turma}
          </td>

        `;


        tabela.appendChild(
          linha
        );

      });


      semReservas.style.display =
        "none";

    }


    // ==========================================
    // CARREGAR AULAS
    // ==========================================

    async function carregarAulas() {

      const {
        data: aulas,
        error
      } =
        await supabaseClient
          .from("aulas")
          .select(
            "id, data, horario_inicio, horario_fim, turma, capacidade, ativo"
          )
          .order(
            "data",
            {
              ascending: true
            }
          )
          .order(
            "horario_inicio",
            {
              ascending: true
            }
          );


      if (error) {

        console.error(
          "Erro ao carregar aulas:",
          error
        );

        return;
      }


      const tabela =
        document.getElementById(
          "aulasTabela"
        );


      const semAulas =
        document.getElementById(
          "semAulas"
        );


      if (!tabela) {

        console.error(
          "Elemento aulasTabela não encontrado."
        );

        return;
      }


      tabela.innerHTML = "";


      if (
        !aulas ||
        aulas.length === 0
      ) {

        semAulas.style.display =
          "block";

        return;
      }


      aulas.forEach(aula => {

        const linha =
          document.createElement(
            "tr"
          );


        const dataFormatada =
          aula.data
            .split("-")
            .reverse()
            .join("/");


        const horario =
          `${aula.horario_inicio.slice(0, 5)} — ${aula.horario_fim.slice(0, 5)}`;


        const status =
          aula.ativo
            ? "Ativa"
            : "Inativa";


      const acao = `
  <button onclick="editarAula('${aula.id}')">Editar</button>
  ${
    aula.ativo
      ? `<button onclick="alterarStatusAula('${aula.id}', false)">Desativar</button>`
      : `<button onclick="alterarStatusAula('${aula.id}', true)">Ativar</button>`
  }
`;


        linha.innerHTML = `

          <td>
            ${dataFormatada}
          </td>

          <td>
            ${horario}
          </td>

          <td>
            ${aula.turma}
          </td>

          <td>
            ${aula.capacidade}
          </td>

          <td>
            ${status}
          </td>

          <td>
            ${acao}
          </td>

        `;


        tabela.appendChild(
          linha
        );

      });


      semAulas.style.display =
        "none";

    }


    // ==========================================
    // ATIVAR / DESATIVAR AULA
    // ==========================================

    async function alterarStatusAula(
      id,
      novoStatus
    ) {

      const acaoTexto =
        novoStatus
          ? "ativar"
          : "desativar";


      const confirmar =
        confirm(
          `Tem certeza que deseja ${acaoTexto} esta aula?`
        );


      if (!confirmar) {

        return;
      }


      const {
        error
      } =
        await supabaseClient
          .from("aulas")
          .update({
            ativo: novoStatus
          })
          .eq(
            "id",
            id
          );


      if (error) {

        console.error(
          "Erro ao alterar status da aula:",
          error
        );


        alert(
          "Não foi possível alterar o status da aula."
        );


        return;
      }


      await carregarAulas();

    }


    
    async function editarAula(id) {
  const { data: aula, error } = await supabaseClient
    .from("aulas")
    .select("id, data, horario_inicio, horario_fim, turma, capacidade")
    .eq("id", id)
    .single();

  if (error) {
    console.error("Erro ao carregar aula:", error);
    alert("Não foi possível carregar os dados da aula.");
    return;
  }

  const novaData = prompt("Data da aula (AAAA-MM-DD):", aula.data);
  if (novaData === null) return;

  const novoInicio = prompt(
    "Horário de início (HH:MM):",
    aula.horario_inicio.slice(0, 5)
  );
  if (novoInicio === null) return;

  const novoFim = prompt(
    "Horário de término (HH:MM):",
    aula.horario_fim.slice(0, 5)
  );
  if (novoFim === null) return;

  const novaTurma = prompt("Nome da turma:", aula.turma);
  if (novaTurma === null) return;

  const novaCapacidade = prompt(
    "Capacidade:",
    aula.capacidade
  );
  if (novaCapacidade === null) return;

  const capacidadeNumero = Number(novaCapacidade);

  if (!novaData || !novoInicio || !novoFim || !novaTurma || !capacidadeNumero) {
    alert("Preencha todos os campos corretamente.");
    return;
  }

  const { error: updateError } = await supabaseClient
    .from("aulas")
    .update({
      data: novaData,
      horario_inicio: novoInicio,
      horario_fim: novoFim,
      turma: novaTurma,
      capacidade: capacidadeNumero
    })
    .eq("id", id);

  if (updateError) {
    console.error("Erro ao editar aula:", updateError);
    alert("Não foi possível editar a aula.");
    return;
  }

  alert("Aula atualizada com sucesso!");
  await carregarAulas();
}

    // ==========================================
    // CADASTRAR NOVA AULA
    // ==========================================

    document
      .getElementById(
        "formNovaAula"
      )
      .addEventListener(
        "submit",
        async (event) => {

          event.preventDefault();


          const data =
            document.getElementById(
              "novaData"
            ).value;


          const horarioInicio =
            document.getElementById(
              "novoInicio"
            ).value;


          const horarioFim =
            document.getElementById(
              "novoFim"
            ).value;


          const turma =
            document.getElementById(
              "novaTurma"
            ).value;


          const capacidade =
            Number(
              document.getElementById(
                "novaCapacidade"
              ).value
            );


          const mensagem =
            document.getElementById(
              "mensagemNovaAula"
            );


          mensagem.textContent =
            "Cadastrando aula...";


          const {
            error
          } =
            await supabaseClient
              .from("aulas")
              .insert({

                data: data,

                horario_inicio:
                  horarioInicio,

                horario_fim:
                  horarioFim,

                turma: turma,

                capacidade:
                  capacidade,

                ativo: true

              });


          if (error) {

            console.error(
              "Erro ao cadastrar aula:",
              error
            );


            mensagem.textContent =
              "Erro ao cadastrar aula.";


            return;
          }


          mensagem.textContent =
            "Aula cadastrada com sucesso!";


          document
            .getElementById(
              "formNovaAula"
            )
            .reset();


          document
            .getElementById(
              "novaCapacidade"
            )
            .value = 8;


          await carregarAulas();

        }
      );


    // ==========================================
    // LOGOUT
    // ==========================================

    document
      .getElementById(
        "logoutBtn"
      )
      .addEventListener(
        "click",
        async () => {

          await supabaseClient
            .auth
            .signOut();


          window.location.href =
            "admin.html";

        }
      );


    // ==========================================
    // INICIAR PAINEL
    // ==========================================

    verificarAcesso();

  </script>

</body>

</html>
