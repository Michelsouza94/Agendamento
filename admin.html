<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Área administrativa - Agendamento</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    p {
      color: #666;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #mensagem {
      margin-top: 16px;
      color: #c00;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>Área administrativa</h1>
    <p>Entre com seu usuário administrador.</p>

    <form id="loginForm">

      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        placeholder="seu@email.com"
        required
      >

      <label for="password">Senha</label>
      <input
        type="password"
        id="password"
        placeholder="Sua senha"
        required
      >

      <button type="submit">Entrar</button>

      <div id="mensagem"></div>

    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="admin.js"></script>
  
</body>
</html>
